<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Open Graph card, 1200x630. Rendered headless to a PNG; nothing here ships to the site. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #05070d;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #dde5f0;
    position: relative;
    overflow: hidden;
  }
  /* Calibration grid + aurora, the same two layers the site's hero uses. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,170,220,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,220,0.10) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 85% 80% at 30% 40%, #000 25%, transparent 80%);
  }
  .aurora {
    position: absolute; inset: -20%;
    background:
      radial-gradient(38% 46% at 20% 30%, rgba(79,215,232,0.26), transparent 70%),
      radial-gradient(36% 42% at 82% 22%, rgba(239,123,118,0.20), transparent 72%),
      radial-gradient(44% 40% at 66% 82%, rgba(179,155,255,0.18), transparent 70%);
    filter: blur(20px);
  }
  .wrap { position: relative; padding: 74px 80px; height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 18px; }
  .logo { width: 62px; height: 62px; }
  .name { font-size: 40px; font-weight: 680; letter-spacing: -0.02em; }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #93a3bb; border: 1px solid rgba(140,180,220,0.28);
    border-radius: 999px; padding: 7px 15px;
  }
  h1 {
    margin-top: 30px;
    font-size: 78px; line-height: 1.03; letter-spacing: -0.035em; font-weight: 760;
  }
  h1 em { font-style: normal; color: #4fd7e8; }
  p {
    margin-top: 24px; font-size: 25px; line-height: 1.5; color: #93a3bb; max-width: 800px;
  }
  .foot {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 18px; color: #93a3bb; letter-spacing: 0.05em;
  }
  .foot code { color: #dde5f0; }
  /* HUD corner brackets, matching the site's panel treatment. */
  .b { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(79,215,232,0.7); }
  .tl { top: 30px; left: 30px; border-top-width: 3px; border-left-width: 3px; }
  .tr { top: 30px; right: 30px; border-top-width: 3px; border-right-width: 3px; }
  .bl { bottom: 30px; left: 30px; border-bottom-width: 3px; border-left-width: 3px; }
  .br { bottom: 30px; right: 30px; border-bottom-width: 3px; border-right-width: 3px; }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="grid"></div>
  <span class="b tl"></span><span class="b tr"></span><span class="b bl"></span><span class="b br"></span>
  <div class="wrap">
    <div class="top">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
        <defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ef7b76"/><stop offset="100%" stop-color="#c8442f"/>
        </linearGradient></defs>
        <g fill="none" stroke="url(#s)" stroke-width="9" stroke-linecap="round">
          <circle cx="100" cy="100" r="72" stroke-opacity="0.9"/>
        </g>
        <g fill="url(#s)" fill-opacity="0.85">
          <path d="M100 34 L143 59 L100 84 L57 59 Z"/>
          <path d="M157 66 L157 116 L114 91 L114 41 Z" transform="rotate(60 100 100)"/>
          <path d="M157 66 L157 116 L114 91 L114 41 Z" transform="rotate(180 100 100)"/>
        </g>
        <g fill="#FFFFFF">
          <path d="M74 84c17-5 35-5 52 0 0 6 0 11 0 17-17-5-35-5-52 0 0-6 0-11 0-17z" opacity="0.95"/>
          <path d="M74 108c17-5 35-5 52 0 0 6 0 11 0 17-17-5-35-5-52 0 0-6 0-11 0-17z" opacity="0.8"/>
        </g>
      </svg>
      <span class="name">scalacv</span>
    </div>

    <div class="chips">
      <span class="chip">OpenCV 4.14</span>
      <span class="chip">Scala 3.3 LTS</span>
      <span class="chip">JDK 17+</span>
      <span class="chip">Headless</span>
    </div>

    <h1>Teach the JVM<br>to see <em>edges</em></h1>
    <p>A fluent, typed image pipeline over the complete OpenCV Java bindings — and honest about native memory.</p>

    <div class="foot">
      <span><code>img.gray.blur(2).canny(80, 160)</code></span>
      <span>w0rxbend.github.io/scalacv</span>
    </div>
  </div>
</body>
</html>
