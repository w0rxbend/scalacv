name: Docs

# Builds the Docusaurus site and deploys it to GitHub Pages. mdoc type-checks every Scala snippet
# first (via scripts/assemble-docs.sh), so a code change that breaks a doc example fails here rather
# than shipping a wrong example. The mdoc check also runs on PRs (in ci.yml), so drift is caught
# before merge, not only at deploy time.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MILL_JVM_ID: zulu:25
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v8
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      # mdoc (type-checks + splices snippets) -> copy pages into website/docs; unified Scaladoc
      # (core+vision+graphs) + zio -> website/static/api; then verify every in-content /api/ link
      # resolves to a generated Scaladoc file. Same script as the local dev loop, so CI and local
      # builds cannot diverge.
      - name: Assemble docs (mdoc + Scaladoc + API-link check)
        run: ./scripts/assemble-docs.sh

      - name: Build the Docusaurus site
        working-directory: website
        run: |
          npm ci
          npm run build

      # ONE-TIME OWNER ACTION before the first deploy: Settings -> Pages -> Source: "GitHub Actions".
      # The default GITHUB_TOKEN cannot create the Pages site itself; everything above still runs.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
