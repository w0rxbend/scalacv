name: Scala Steward

# Opens dependency-update PRs on a schedule. Runs against the repo's own build, so it picks up
# the version pins in build.mill and the //| mvnDeps header.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          # A PR opened with the default GITHUB_TOKEN does NOT trigger other workflows (GitHub suppresses
          # workflow runs on token-created events), so every Steward PR would land with no CI. Set a
          # repo/org secret SCALA_STEWARD_TOKEN to a PAT (or GitHub App token) with `repo` scope and the
          # dependency PRs get built and tested. Until then this falls back to GITHUB_TOKEN, which still
          # opens the PRs — they just won't run CI automatically.
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
